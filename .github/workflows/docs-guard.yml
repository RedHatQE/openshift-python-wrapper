name: Docs Guard

# pull_request_target, NOT pull_request: with `pull_request` the workflow definition is taken from
# the PR under review, so a PR could keep this job's name and replace the check with `exit 0` in the
# same change that adds generated docs. `pull_request_target` always runs the copy on the base
# branch, so the check cannot be rewritten by the change it is checking.
#
# Nothing from the PR is checked out or executed: the changed paths are read from the REST API and
# filtered in jq. That keeps PR code (and a repository token in .git/config) out of reach, and it
# sidesteps git's path quoting — an API path arrives as a JSON string, so a non-ASCII or
# newline-containing name cannot dodge the patterns below.
#
# Consequence: because the base branch has no copy of this file yet, the check does not run on the
# PR that introduces it; it applies to every PR opened after it lands.
on: pull_request_target

permissions:
  pull-requests: read

jobs:
  no-generated-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Reject generated docs in the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT

          # Only added/modified/renamed/copied files are a violation: a DELETION is the migration
          # itself (removing the committed output) and must pass, or the PR that fixes the rule can
          # never satisfy it. A rename or copy is checked on BOTH sides, so
          # docs/foo.md -> docs/index.html is caught too. A type change (file -> symlink) arrives as
          # `modified`, which is included.
          #
          # Inverted allowlist: docs/**/*.md and docs/nav.json are the sources; everything else under
          # docs/ is what .github/workflows/docs.yml builds. Each offender is emitted with @json so a
          # path containing a newline stays on one line instead of splitting into two non-matching
          # ones.
          if ! gh api --paginate -H "Accept: application/vnd.github+json" \
                "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
                --jq '
                  .[]
                  | select(.status != "removed")
                  | ((.previous_filename // empty), .filename)
                  | select(startswith("docs/"))
                  | select(. != "docs/nav.json")
                  | select(endswith(".md") | not)
                  | @json
                ' > "$offenders"; then
            # A listing that never ran must not be read as "nothing found".
            echo "::error::could not list the pull request changed files — refusing to report a pass."
            exit 1
          fi

          if [ -s "$offenders" ]; then
            echo "::error::Generated docs must not be committed — the site is built on main from the docs sources."
            while IFS= read -r line; do echo "  $line"; done < "$offenders"
            echo "Everything under docs/ other than docs/**/*.md and docs/nav.json is build output of"
            echo ".github/workflows/docs.yml — edit the markdown source instead."
            exit 1
          fi
          echo "No generated docs in the diff."
